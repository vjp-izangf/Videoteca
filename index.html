<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoteca</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <h1 id="titulo">Videoteca</h1>
        <p id="resumen"></p>
    </header>

    <nav id="mostrarResultado">
    </nav>
    <section class="controles">
        <input id="buscador" type="search" placeholder="Buscar..">
        <button id="ordenNombre">Ordenar A-Z </button>
        <button id="ordenPrecio">Ordenar por precio</button>
        <button id="ordenFecha">Mas recientes primero</button>
    </section>

    <section id="formulario-videojuego" >
        <h2>Añadir videojuego</h2>

        <input
            type="text"
            id="nuevoTitulo"
            placeholder="Nombre del videojuego"
        >
    <button id="anadirVideojuego">Añadir</button>

    <p id="aviso"></p>
    </section>
    
    <!--Estadísticas-->
    <section id="estadisticas">
        <h2>Estadísticas de la Videoteca</h2>

        <p><span id="precio-medio">0€</span></p>
        <p><span id="precio-maximo">0€</span></p>
        <p><span id="precio-total">0€</span></p>
    </section>
    
    <main id="listado">

        <section>
            <h2>Lista de videojuegos</h2>
            <div id="lista-videojuegos"></div>
        </section>
    </main>
    <script src="js/app.js" defer></script>
    <footer>
        <p>Videoteca - Videoteca de juegos</p>
    </footer>

</body>
</html>
