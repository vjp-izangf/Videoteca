<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoteca</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <h1 id="titulo">Videoteca</h1>
        <p id="resumen"></p>
        <p id="estadisticas"></p>
    </header>

    <nav id="menu-videoteca">
            <p>Total de juegos: <span id="total-juegos">0</span></p>
    </nav>

    <section class="controles">
        <input id="buscador" type="search" placeholder="Buscar..">
        <button id="ordenNombre">Ordenar A-Z </button>
        <button id="ordenPrecio">Ordenar por ...</button>
    </section>

    <main id="listado">

        <section>
            <h2>Lista de videojuegos</h2>
            <div id="lista-videojuegos"></div>
        </section>
    </main>
    <script src="js/app.js" defer></script>
    <footer>
        <p>Videoteca - Videoteca de juegos</p>
    </footer>

</body>
</html>
